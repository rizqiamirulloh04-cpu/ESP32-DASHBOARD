<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ESP32 Dashboard Installer</title>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;

      background: #0f0f0f;
      color: white;

      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
    }

    .card {
      width: 340px;

      background: #1b1b1b;

      border-radius: 24px;

      padding: 30px;

      text-align: center;

      box-shadow: 0 0 30px rgba(0,255,255,0.15);
    }

    h1 {
      margin-top: 0;
      color: cyan;
    }

    p {
      opacity: 0.8;
      line-height: 1.5;
    }

    button {
      margin-top: 20px;

      border: none;

      background: cyan;
      color: black;

      padding: 14px 24px;

      border-radius: 12px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>ESP32-DASHBOARD</h1>

    <p>
      ESP32-C6 OTA Installer<br>
      Waveshare LCD 1.47
    </p>

    <esp-web-install-button manifest="manifest.json">

      <button slot="activate">
        INSTALL FIRMWARE
      </button>

    </esp-web-install-button>

    <div class="footer">
      OTA Web Installer Ready
    </div>

  </div>

</body>

</html>
